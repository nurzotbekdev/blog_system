version: "3.9"

services:
  db:
    image: postgres:18-alpine
    container_name: blog_system_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: blog_system_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  rabbitmq:
    image: rabbitmq:management
    container_name: blog_system_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"

  app:
    build: .
    container_name: blog_system
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - rabbitmq
    command: ["./main"]

volumes:
  db_data:
